[project]
name = "splatmorph-fields"
version = "0.1.0"
description = "Depth-derived field analysis for image-aligned Gaussian splat grids: relative elevation, glare-fused shard displacement fields, curl-of-depth flow, ROI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ameer J" }]
dependencies = ["numpy", "scipy", "pillow", "plyfile"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splatmorph_fields"]
