[project]
name = "splatmorph-transport"
version = "0.1.0"
description = "Banded entropic optimal transport for dense grid correspondence: feature + neighborhood-context costs, trajectory-band position barrier, peak-trough anti-pairing, bidirectional barycentric maps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ameer J" }]
dependencies = ["numpy", "torch", "scipy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splatmorph_transport"]
