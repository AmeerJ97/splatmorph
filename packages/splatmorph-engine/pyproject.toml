[project]
name = "splatmorph-engine"
version = "0.1.0"
description = "Symmetric two-set Gaussian splat morph engine: transport-guided quadratic Bezier trajectories, endpoint purity by construction, choreography layers (shards, curl, streaks), and built-in verification gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ameer J" }]
dependencies = [
  "numpy",
  "torch",
  "scipy",
  "pillow",
  "imageio[ffmpeg]",
  "splatmorph-transport",
  "splatmorph-fields",
]

[tool.uv.sources]
splatmorph-transport = { workspace = true }
splatmorph-fields = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splatmorph_engine"]
