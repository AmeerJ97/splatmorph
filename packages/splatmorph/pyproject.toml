[project]
name = "splatmorph"
version = "0.1.0"
description = "Two images in, one seamlessly-looping 3D Gaussian morph out. One transport functional decides membership, ordering, pairing, and trajectory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ameer J" }]
keywords = ["gaussian-splatting", "morphing", "optimal-transport", "graphics", "loop"]
dependencies = [
  "numpy",
  "torch",
  "pillow",
  "scipy",
  "imageio[ffmpeg]",
  "splatmorph-transport",
  "splatmorph-fields",
  "splatmorph-engine",
]

[project.optional-dependencies]
lpips = ["lpips"]
dev = ["pytest", "ruff"]

[project.scripts]
splatmorph = "splatmorph.cli:main"

[project.urls]
Repository = "https://github.com/AmeerJ97/splatmorph"

[tool.uv.sources]
splatmorph-transport = { workspace = true }
splatmorph-fields = { workspace = true }
splatmorph-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splatmorph"]
