---
name: ci

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch, no GPU/SHARP needed for unit gates)
        run: |
          pip install torch \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -e packages/splatmorph-transport \
            -e packages/splatmorph-fields
          pip install -e packages/splatmorph-engine \
            -e packages/splatmorph
          pip install pytest ruff
      - name: Lint
        run: ruff check packages tests
      - name: Verification gates (CPU miniature)
        run: pytest -q
